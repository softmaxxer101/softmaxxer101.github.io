<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    ✏️ EDIT YOUR CONTENT: scroll to the <script> near the bottom of
    this file and edit the CONFIG object. That's the only part you
    need to touch to add, edit, or remove projects, links, or socials.
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0d10">
  <meta name="description" content="ALIS — portfolio. Reasoning · RL · MATH">
  <title>ALIS — portfolio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230b0d10'/><rect x='30' y='30' width='40' height='40' rx='8' fill='%23ffcc00'/></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0d10;
      --surface: #14171c;
      --surface-hover: #1a1f26;
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,204,0,0.5);
      --yellow: #ffcc00;
      --yellow-dim: rgba(255,204,0,0.12);
      --ink: #e8eaed;
      --muted: #8b93a1;
      --grid-line: rgba(139,147,161,0.07);
      --font-display: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', 'SFMono-Regular', Menlo, monospace;
      --radius: 10px;
      --max-w: 1100px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-display);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    svg { display: block; }
    ::selection { background: var(--yellow); color: #0b0d10; }

    :focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 3px;
    }

    /* ============ HERO ============ */
    .hero {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 48px 48px;
      -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 40%, transparent 90%);
              mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 40%, transparent 90%);
    }

    .hero-bg::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: -140px;
      height: 140px;
      background: linear-gradient(to bottom, transparent, rgba(255,204,0,0.06), transparent);
      animation: scanSweep 9s linear infinite;
    }

    @keyframes scanSweep {
      0%   { transform: translateY(0); }
      100% { transform: translateY(calc(100vh + 140px)); }
    }

    .hero-inner {
      position: relative;
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 1.5rem;
      width: 100%;
    }

    .kicker {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }

    .kicker::before { content: '// '; color: var(--yellow); }

    .hero-name {
      font-size: clamp(3rem, 11vw, 6.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 0.95;
      text-shadow: 0 0 60px rgba(255,204,0,0.18);
    }

    .hero-tagline {
      margin-top: 1.25rem;
      max-width: 38ch;
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      color: var(--muted);
    }

    .hero-divider {
      width: 64px;
      height: 2px;
      background: linear-gradient(90deg, var(--yellow), transparent);
      margin: 2.25rem 0;
    }

    .scroll-cue {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .scroll-cue:hover { color: var(--yellow); transform: translateY(3px); }
    .scroll-cue svg { width: 14px; height: 14px; animation: bob 1.8s ease-in-out infinite; }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(4px); }
    }

    /* ============ SECTIONS ============ */
    .section {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 6rem 1.5rem;
      scroll-margin-top: 2rem;
    }

    .section-heading {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--yellow);
      margin-bottom: 2.5rem;
    }

    /* ============ PROJECTS ============ */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .project-card {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
    }

    .project-card:hover,
    .project-card:focus-visible {
      transform: translateY(-4px);
      border-color: var(--border-hover);
      background: var(--surface-hover);
    }

    .project-path {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 0.85rem;
    }

    .project-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.6rem;
    }

    .project-desc {
      flex: 1;
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 1.25rem;
    }

    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1.25rem;
    }

    .project-tags span {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      padding: 0.25rem 0.55rem;
      border-radius: 99px;
      background: var(--yellow-dim);
      color: var(--yellow);
    }

    .project-link-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--muted);
    }

    .project-card:hover .project-link-row { color: var(--yellow); }
    .project-link-row svg { width: 13px; height: 13px; transition: transform 0.25s ease; }
    .project-card:hover .project-link-row svg { transform: translate(2px, -2px); }

    /* ============ WRITINGS ============ */
    .writings-list {
      display: flex;
      flex-direction: column;
    }

    .writing-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1.5rem;
      padding: 1.25rem 0;
      border-bottom: 1px solid var(--border);
      transition: border-color 0.2s ease, padding-left 0.2s ease;
    }

    .writing-row:last-child { border-bottom: none; }

    .writing-row:hover,
    .writing-row:focus-visible {
      border-color: var(--border-hover);
      padding-left: 0.5rem;
    }

    .writing-title-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
      overflow: hidden;
    }

    .writing-title {
      font-size: 1.05rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .writing-row:hover .writing-title { color: var(--yellow); }

    .writing-title-group svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .writing-row:hover .writing-title-group svg { opacity: 1; transform: translate(2px, -2px); }

    .writing-date {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ============ SOCIALS ============ */
    .socials-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
    }

    .social-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: 99px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      transition: border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .social-pill:hover,
    .social-pill:focus-visible {
      border-color: var(--yellow);
      color: var(--yellow);
      transform: translateY(-2px);
    }

    .social-pill svg { width: 13px; height: 13px; }

    /* ============ FOOTER ============ */
    .footer {
      text-align: center;
      padding: 3rem 1.5rem 4rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .hero-inner { padding: 0 1.25rem; }
      .section { padding: 4rem 1.25rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .hero-bg::after { animation: none; }
      .scroll-cue svg { animation: none; }
      .project-card, .social-pill, .scroll-cue, .project-link-row svg,
      .writing-row, .writing-title-group svg {
        transition: none;
      }
    }
  </style>
</head>
<body>

  <header class="hero" id="hero">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="hero-inner">
      <p class="kicker" id="hero-kicker"></p>
      <h1 class="hero-name" id="hero-name"></h1>
      <p class="hero-tagline" id="hero-tagline"></p>
      <div class="hero-divider"></div>
      <a href="#projects" class="scroll-cue" aria-label="Scroll to projects">
        <span>Scroll</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </a>
    </div>
  </header>

  <main>
    <section class="section" id="projects" aria-labelledby="projects-heading">
      <h2 class="section-heading" id="projects-heading">[ Projects ]</h2>
      <div class="projects-grid" id="projects-grid"></div>
    </section>

    <section class="section" id="writings" aria-labelledby="writings-heading">
      <h2 class="section-heading" id="writings-heading">[ Writings ]</h2>
      <div class="writings-list" id="writings-list"></div>
    </section>

    <section class="section" id="socials" aria-labelledby="socials-heading">
      <h2 class="section-heading" id="socials-heading">[ Elsewhere ]</h2>
      <div class="socials-row" id="socials-row"></div>
    </section>
  </main>

  <footer class="footer">
    <p>© <span id="footer-year"></span> <span id="footer-name"></span></p>
  </footer>

  <script>
    /* ============================================================
       ✏️  EDIT ME
       Everything you need to customize this site lives in this one
       CONFIG object. To add a project or social link, copy an
       existing entry, edit its values, and add a comma. To remove
       one, delete its entry. Nothing else in this file needs to
       change.
       ============================================================ */
    const CONFIG = {

      hero: {
        kicker: 'Reasoning · RL · MATH',
        name: 'ALIS',
        tagline: 'trying to enter frontier research'
      },

      // Each project needs: title, description, tags (array), link.
      projects: [
        {
          title: 'Transformer in PyTorch',
          date: '23 July 2026',
          //tags: ['Python', 'PyTorch', 'Interpretability'],
          link: 'https://github.com/softmaxxer101/transformer'
        },
        {
          title: 'KV-Cache with MHA in PyTorch',
          date: '28 July 2026',
          //tags: ['Research', 'Python', 'Efficient Inference'],
          link: 'https://github.com/softmaxxer101/kv-cache'
        },
      ],

      // Each writing needs: title, date, link. Newest first — order here = order shown.
      writings: [
        {
          title: 'an explanation of whole transformer',
          date: '23 Jul 2026',
          link: 'https://alisintensorland.blogspot.com/2026/07/wtf-is-transformer-you-must-be-familiar.html'
        },
        {
          title: 'KV Cache- theory and its implementation',
          date: '28 Jul 2026',
          link: 'https://alisintensorland.blogspot.com/2026/07/kv-cache-question-or-solution-i-bet.html'
        },
      ],

      // Each social needs: label, url. Order here = order shown.
      socials: [
        { label: 'GitHub',       url: 'https://github.com/softmaxxer101' },
        { label: 'LinkedIn',     url: 'https://linkedin.com/in/softmaxxer101' },
        { label: 'X / Twitter',  url: 'https://x.com/import_alis' },
        { label: 'Hugging Face', url: 'https://huggingface.co/softmaxxer101' },
        { label: 'Email',        url: 'mailto:softmaxxer101@gmail.com' }
      ]
    };

    /* ============================================================
       Rendering logic — you shouldn't need to edit anything below.
       ============================================================ */

    const arrowIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>`;

    function slugify(str) {
      return str.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    }

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderHero() {
      document.getElementById('hero-kicker').textContent = CONFIG.hero.kicker;
      document.getElementById('hero-name').textContent = CONFIG.hero.name;
      document.getElementById('hero-tagline').textContent = CONFIG.hero.tagline;
      document.getElementById('footer-name').textContent = CONFIG.hero.name;
      document.title = `${CONFIG.hero.name} — portfolio`;
    }

    function renderProjects() {
      const grid = document.getElementById('projects-grid');
      grid.innerHTML = CONFIG.projects.map(p => `
        <a class="project-card" href="${escapeHTML(p.link)}" target="_blank" rel="noopener noreferrer">
          <span class="project-path">~/projects/${slugify(p.title)}</span>
          <span class="project-title">${escapeHTML(p.title)}</span>
          <p class="project-desc">${escapeHTML(p.description)}</p>
          <div class="project-tags">${p.tags.map(t => `<span>${escapeHTML(t)}</span>`).join('')}</div>
          <div class="project-link-row">View project ${arrowIcon}</div>
        </a>
      `).join('');
    }

    function renderWritings() {
      const list = document.getElementById('writings-list');
      list.innerHTML = CONFIG.writings.map(w => `
        <a class="writing-row" href="${escapeHTML(w.link)}" target="_blank" rel="noopener noreferrer">
          <span class="writing-title-group">
            <span class="writing-title">${escapeHTML(w.title)}</span>
            ${arrowIcon}
          </span>
          <span class="writing-date">${escapeHTML(w.date)}</span>
        </a>
      `).join('');
    }

    function renderSocials() {
      const row = document.getElementById('socials-row');
      row.innerHTML = CONFIG.socials.map(s => `
        <a class="social-pill" href="${escapeHTML(s.url)}" target="_blank" rel="noopener noreferrer">
          ${escapeHTML(s.label)} ${arrowIcon}
        </a>
      `).join('');
    }

    document.getElementById('footer-year').textContent = new Date().getFullYear();
    renderHero();
    renderProjects();
    renderWritings();
    renderSocials();
  </script>

</body>
</html>
